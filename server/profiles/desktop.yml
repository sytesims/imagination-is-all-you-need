# The desktop app (npm start / npm run dev). One plugin id per line; leave a line out to turn that plugin off.
# The places service is part of the kernel and always on. `legacy` (today's server) always starts last.
name: desktop
plugins:
  - place-comfy-local   # Your computer (your ComfyUI, built-in tools)
  - place-comfy-cloud   # Comfy Cloud and your Comfy deployment (your Comfy key)
  - place-comfy-router  # Comfy Router (your Comfy key)
  - place-fal           # fal (your fal key)
  - place-replicate     # Replicate (your Replicate token)
  - place-sunra         # Sunra (your Sunra key; its models stay hidden until the key is set)
  # place-kie is installable and off here: add a line `- place-kie` above legacy to use kie.ai (a reseller; docs/PROVIDERS-AND-MODELS.md)
  - place-direct        # the labs' own APIs: BFL, Google, OpenAI, BytePlus, MiniMax, LTX (their keys)
  - place-sample        # free samples, and samples on the mock backend
  - legacy
