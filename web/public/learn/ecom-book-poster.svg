<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576">
  <!-- Explore card poster for the e-commerce pop-up book: our own drawing (Imagination Is All You Need, AGPL-3.0-or-later). -->
  <defs>
    <radialGradient id="desk" cx="50%" cy="48%" r="75%"><stop offset="0" stop-color="#3a2f26"/><stop offset=".55" stop-color="#1c1814"/><stop offset="1" stop-color="#0c0b0a"/></radialGradient>
    <linearGradient id="gutL" x1="1" x2="0"><stop offset="0" stop-color="#5b4630" stop-opacity=".35"/><stop offset=".3" stop-color="#5b4630" stop-opacity=".06"/><stop offset="1" stop-color="#5b4630" stop-opacity="0"/></linearGradient>
    <linearGradient id="gutR" x1="0" x2="1"><stop offset="0" stop-color="#5b4630" stop-opacity=".35"/><stop offset=".3" stop-color="#5b4630" stop-opacity=".06"/><stop offset="1" stop-color="#5b4630" stop-opacity="0"/></linearGradient>
    <pattern id="h1" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#26221E" stroke-width="1.6"/></pattern>
    <pattern id="h2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#26221E" stroke-width="1.4"/></pattern>
    <pattern id="hO" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#8A3A05" stroke-width="1.6"/></pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <style>
      .flow{fill:none;stroke:#FF7A1A;stroke-width:5;stroke-linecap:round;stroke-dasharray:14 11;animation:run 1.6s linear infinite}
      .halo{fill:none;stroke:#FF7A1A;stroke-width:14;stroke-linecap:round;opacity:.16}
      .dot{fill:#FF7A1A;stroke:#FFF6EA;stroke-width:3}
      .ring{fill:none;stroke:#FF7A1A;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
      @keyframes run{to{stroke-dashoffset:-50}}
      @keyframes pulse{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.7);opacity:0}}
      @media (prefers-reduced-motion:reduce){.flow,.ring{animation:none}}
    </style>
  </defs>
