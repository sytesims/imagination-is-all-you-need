name: CI

# Pull requests: Build and start on all three systems, and the one-line install on Ubuntu only, unless the PR touches
# the installer, setup/launcher scripts or package files (then also ARM64 Linux, and get.sh in a fresh Ubuntu container).
# main (push, nightly, by hand): everything.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *' # nightly full run on main, so there is a complete run even on busy days
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR or to main cancels the older run. The nightly run has its own group, so pushes never cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: true

jobs:
  # Which systems the one-line install runs on. On a PR the checkout is GitHub's merge commit, so HEAD^1 is the base
  # branch and `HEAD^1...HEAD` is exactly what the PR changes (fetch-depth 2 is enough).
  scope:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      install_os: ${{ steps.pick.outputs.install_os }}
      build_os: ${{ steps.pick.outputs.build_os }}
      full: ${{ steps.pick.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: pick
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          all='["ubuntu-latest","ubuntu-24.04-arm","macos-latest","windows-latest"]'
          three='["ubuntu-latest","macos-latest","windows-latest"]'
          full() { { echo "install_os=$all"; echo "build_os=$all"; echo "full=true"; } >> "$GITHUB_OUTPUT"; }
          if [ "$EVENT" != pull_request ]; then full; exit 0; fi
          changed=$(git diff --name-only HEAD^1...HEAD)
          printf '%s\n' "$changed"
          # installer, setup/launcher scripts, package files, this workflow
          if grep -qE '^(scripts/(get|install)\.(sh|ps1)|scripts/(setup|start|update|doctor|app-env|env-merge|install-mcp|web-build|build-plugins|node-version)\.mjs|server/src/doctor/.*|scripts/(make-mac-app\.sh|mac-app/.*)|((server|web|mcp)/)?package(-lock)?\.json|\.github/workflows/ci\.yml)$' <<<"$changed"; then
            echo "Install or setup files changed: everything"; full
          else
            echo "No install or setup files changed: one-line install on Ubuntu only"
            { echo 'install_os=["ubuntu-latest"]'; echo "build_os=$three"; echo "full=false"; } >> "$GITHUB_OUTPUT"
          fi

  build-start:
    name: Build and start (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: scope
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.build_os) }}
        # 24 (what the installers add) and 26 (the newest long-term support line); the one-line install below runs on 22
        node: ['24', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      - name: Install app dependencies
        run: npm ci --no-audit --no-fund
      - name: Build production app
        run: npm run build
      - name: Test smoke lifecycle (fixtures only)
        run: node --test --test-concurrency=1 scripts/ci-smoke.test.mjs
      # API + web only: no models, GPU, provider calls or MCP verification.
      - name: Start production API and web (mock, 60-second readiness)
        run: node scripts/ci-smoke.mjs

  # The MCP server (mcp/, its own package): build it and run its tests that need no running app, plus the catalogue drift test, which starts
  # its own mock API (no keys, nothing paid). mcp/test/e2e.ts and the tests that need a sandbox API (permissions, library, skills) stay manual.
  mcp:
    name: MCP server (build and tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      - name: Install dependencies (root, then mcp/ through the postinstall step)
        run: npm ci --no-audit --no-fund
      # ffmpeg: the mock API renders its sample results with it (catalog's local create-image run fails with "ffmpeg 127" without it)
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -version | head -1
      - name: Build (tsc)
        run: npm run mcp:build
      - name: Tests
        working-directory: mcp
        env:
          CATALOG_PORT: '8842'
        run: |
          for t in toolsets accounts parity dist-fresh catalog; do echo "::group::$t"; npx tsx "test/$t.ts"; echo "::endgroup::"; done

  # The script tests outside server/test (the runner there doesn't collect them): Mac launcher, Mac app build, CI smoke fixtures.
  scripts-tests:
    name: Script tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: node --test scripts/*.test.mjs
        run: node --test --test-concurrency=1 scripts/*.test.mjs

  # The one-line installer (scripts/get.sh, scripts/get.ps1) from nothing to a built app, the way a new user runs it:
  # piped into bash / run as a PowerShell script block, with --yes so it installs ffmpeg itself (apt, Homebrew, winget).
  # It clones this commit from the checkout (IIAYN_REPO) into a temp folder; no shortcut, no start.
  one-line-install:
    name: One-line install (${{ matrix.os }}, Node 22)
    needs: scope
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.install_os) }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      - name: Name this commit as a branch to clone
        run: git branch ci-install HEAD

      - name: Install with get.sh (piped into bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          DIR="$RUNNER_TEMP/one line/Imagination"
          cat scripts/get.sh | IIAYN_REPO="file://$GITHUB_WORKSPACE" bash -s -- --yes --no-start --no-shortcut --branch ci-install --dir "$DIR"
          test -d "$DIR/node_modules/fastify"; command -v ffmpeg
          # a second run finds the install and updates it instead of cloning
          IIAYN_REPO="file://$GITHUB_WORKSPACE" bash scripts/get.sh --yes --no-start --no-shortcut --branch ci-install --dir "$DIR" | tee "$RUNNER_TEMP/second.log"
          grep -q "Updating the app in" "$RUNNER_TEMP/second.log"
          grep -qE "up to date|Updated:" "$RUNNER_TEMP/second.log" # the update itself ran (a failed one stops the installer)
          bash scripts/get.sh --dry-run --yes --dir "$RUNNER_TEMP/dry" > /dev/null; test ! -e "$RUNNER_TEMP/dry"
          cd "$DIR" && npm run build
      - name: Check get.ps1 parses
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/get.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }

      - name: Install with get.ps1 (Windows PowerShell, as a script block)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'one line\Imagination'
          $env:IIAYN_REPO = 'file:///' + ($env:GITHUB_WORKSPACE -replace '\\', '/')
          & ([scriptblock]::Create((Get-Content -Raw scripts\get.ps1))) -Yes -NoStart -NoShortcut -Branch ci-install -Dir $dir
          if (-not (Test-Path (Join-Path $dir 'node_modules\fastify'))) { throw 'setup did not finish' }
          & ([scriptblock]::Create((Get-Content -Raw scripts\get.ps1))) -Yes -NoStart -NoShortcut -Branch ci-install -Dir $dir
          Set-Location $dir
          npm.cmd run build
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }

  # get.sh on a fresh Ubuntu 24.04 with no Node.js at all (no setup-node). Ubuntu's own Node is 18, so this runs the
  # NodeSource path for real: it installs curl, adds Node 24 and npm ci finds the ready-made database module (the
  # container has no build tools). Only git is added first, for the checkout get.sh clones from.
  one-line-install-fresh:
    name: One-line install (fresh ubuntu:24.04, no Node)
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 25
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Add git (for the checkout)
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - name: Install with get.sh (Node 24 from NodeSource)
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          git branch ci-install HEAD
          if command -v node; then echo "this container should start without Node.js"; exit 1; fi
          DIR=/tmp/one/Imagination
          IIAYN_REPO="file://$GITHUB_WORKSPACE" bash scripts/get.sh --yes --no-start --no-shortcut --branch ci-install --dir "$DIR"
          node --version | grep '^v24\.'
          test -d "$DIR/node_modules/fastify"
