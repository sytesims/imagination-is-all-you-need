# Runs the server test suite, split over 6 machines. Guide: docs/TESTING.md
# No secrets: tests use the mock backend, and the runner (scripts/test-all.mjs) strips every provider key from the environment,
# so nothing here can reach a paid API.
# Private-repo runners have 2 cores and are several times slower than a recent Mac: 2 tests at a time per machine, longer limits.
name: tests

# Full keyless/mock suite for the public repository, separate from the three-OS startup smoke.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json

      # ffmpeg/ffprobe: media tests. lsof + iproute2 (ss): socket checks and the runner's port sweep.
      # python3-pil + python3-numpy: the server's colour match (server/src/tools/soul/colour_transfer.py; soul.test checks it).
      # python3, tar, bash and git are already on the runner.
      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg lsof iproute2 python3-pil python3-numpy
          ffmpeg -version | head -1
          python3 -c "import PIL, numpy; print('Pillow', PIL.__version__, 'NumPy', numpy.__version__)"
          df -h . /tmp | tail -n +2

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests (shard ${{ matrix.shard }}/6)
        run: npm test -- --shard ${{ matrix.shard }}/6 --jobs 2 --timeout 600

      # .test-logs is a dot folder: upload-artifact skips those unless include-hidden-files is on (run 40201002060 uploaded nothing)
      - name: Upload logs of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-shard-${{ matrix.shard }}
          path: .test-logs/
          include-hidden-files: true
          retention-days: 7
