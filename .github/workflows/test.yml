# Runs the server tests. Guide: docs/TESTING.md ("What CI does")
#   main (push, nightly, by hand): the full suite, split over 6 machines.
#   pull requests: only the tests the PR's changes touch (`--changed`), on as many machines as that needs (up to 6);
#   the full suite when the runner maps the change to every test (package files, the runner) or this workflow changed.
# No secrets: tests use the mock backend, and the runner (scripts/test-all.mjs) strips every provider key from the environment,
# so nothing here can reach a paid API.
# Private-repo runners have 2 cores and are several times slower than a recent Mac: 2 tests at a time per machine, longer limits.
name: tests

# Full keyless/mock suite for the public repository, separate from the three-OS startup smoke.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *' # nightly full run on main, so there is a complete run even on busy days
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR or to main cancels the older run. The nightly run has its own group, so pushes never cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: true

jobs:
  # Picks the tests. On a PR the checkout is GitHub's merge commit, so HEAD^1 is the base branch and
  # `--changed --base HEAD^1` sees exactly what the PR changes (fetch-depth 2 is enough). --list needs no npm install.
  pick:
    name: Pick tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      args: ${{ steps.pick.outputs.args }}
      shards: ${{ steps.pick.outputs.shards }}
      count: ${{ steps.pick.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: pick
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          full() { echo "$1: full suite on 6 machines"; { echo 'args='; echo 'shards=[1,2,3,4,5,6]'; echo 'count=6'; } >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$EVENT" = pull_request ] || full "$EVENT"
          git rev-parse -q --verify HEAD^2 > /dev/null || full "No PR merge commit to compare with"
          git diff --quiet HEAD^1...HEAD -- .github/workflows/test.yml || full "This workflow changed"
          all=$(node scripts/test-all.mjs --list | grep -c . || true)
          picked=$(node scripts/test-all.mjs --changed --base HEAD^1 --list | grep -c . || true)
          echo "The PR's changes touch $picked of $all test files"
          [ "$picked" -ge "$all" ] && full "Every test is touched"
          if [ "$picked" -eq 0 ]; then echo "No tests to run"; { echo 'args='; echo 'shards=[1]'; echo 'count=0'; } >> "$GITHUB_OUTPUT"; exit 0; fi
          # as many machines as a full run would use for this many files (about a sixth of the suite each)
          n=$(( (picked * 6 + all - 1) / all ))
          echo "Running them on $n machine(s)"
          { echo 'args=--changed --base HEAD^1'; echo "shards=[$(seq 1 "$n" | paste -sd, -)]"; echo "count=$n"; } >> "$GITHUB_OUTPUT"

  test:
    name: tests (shard ${{ matrix.shard }}/${{ needs.pick.outputs.count }})
    needs: pick
    if: needs.pick.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.pick.outputs.shards) }}
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # --changed compares with HEAD^1 (the PR's base); harmless for full runs

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json

      # ffmpeg/ffprobe: media tests. lsof + iproute2 (ss): socket checks and the runner's port sweep.
      # python3-pil + python3-numpy: the server's colour match (server/src/tools/soul/colour_transfer.py; soul.test checks it).
      # python3, tar, bash and git are already on the runner.
      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg lsof iproute2 python3-pil python3-numpy
          ffmpeg -version | head -1
          python3 -c "import PIL, numpy; print('Pillow', PIL.__version__, 'NumPy', numpy.__version__)"
          df -h . /tmp | tail -n +2

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests (shard ${{ matrix.shard }}/${{ needs.pick.outputs.count }})
        run: npm test -- ${{ needs.pick.outputs.args }} --shard ${{ matrix.shard }}/${{ needs.pick.outputs.count }} --jobs 2 --timeout 600

      # .test-logs is a dot folder: upload-artifact skips those unless include-hidden-files is on (run 40201002060 uploaded nothing)
      - name: Upload logs of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-shard-${{ matrix.shard }}
          path: .test-logs/
          include-hidden-files: true
          retention-days: 7
