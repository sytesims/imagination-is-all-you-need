# Runs the server tests. Guide: docs/TESTING.md ("What CI does")
#   Every run (pull request into any branch, push to main or v2, nightly, by hand): the full suite, split over 6 machines.
#   Pull requests run it too, so a merge only lands after a green full run of the same tree (stacked PRs included).
# No secrets: tests use the mock backend, and the runner (scripts/test-all.mjs) strips every provider key from the environment,
# so nothing here can reach a paid API.
# Runners are several times slower than a recent Mac: 2 tests at a time per machine, longer limits.
name: tests

# Full keyless/mock suite for the public repository, separate from the three-OS startup smoke.
on:
  push:
    branches: [main, v2]
  pull_request: # into any branch, so stacked PRs (based on another PR's branch) are tested too
  schedule:
    - cron: '0 3 * * *' # nightly full run on main, so there is a complete run even on busy days
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR cancels the older run. Pushes to main/v2 (and runs by hand) get a group per commit, so every
# commit gets a complete run: neither cancelled nor dropped while pending behind a newer one. The nightly run has its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # How many machines. Always the full suite: PRs too (the old `--changed --skip-heavy` PR runs let breaks through to main/v2).
  # `npm test -- --changed` stays a local shortcut. Kept as a job so the shard count lives in one place.
  pick:
    name: Pick tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      args: ${{ steps.pick.outputs.args }}
      shards: ${{ steps.pick.outputs.shards }}
      count: ${{ steps.pick.outputs.count }}
    steps:
      - id: pick
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          echo "$EVENT: full suite on 6 machines"
          { echo 'args='; echo 'shards=[1,2,3,4,5,6]'; echo 'count=6'; } >> "$GITHUB_OUTPUT"

  test:
    name: tests (shard ${{ matrix.shard }}/${{ needs.pick.outputs.count }})
    needs: pick
    if: needs.pick.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.pick.outputs.shards) }}
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json

      # the pinned static ffmpeg archive (scripts/ci/install-tools.sh); a new pin changes the file's hash and so the key
      - name: Cache ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/.cache/ci-ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci/install-tools.sh') }}

      # ffmpeg/ffprobe: media tests (a pinned static build, apt only as a time-limited fallback: scripts/ci/install-tools.sh).
      # lsof + iproute2 (ss): socket checks and the runner's port sweep.
      # python3-pil + python3-numpy: the server's colour match (server/src/tools/soul/colour_transfer.py; soul.test checks it).
      # python3, tar, bash and git are already on the runner.
      - name: Install system tools
        timeout-minutes: 15
        run: |
          bash scripts/ci/install-tools.sh --test-tools
          df -h . /tmp | tail -n +2

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests (shard ${{ matrix.shard }}/${{ needs.pick.outputs.count }})
        run: npm test -- ${{ needs.pick.outputs.args }} --shard ${{ matrix.shard }}/${{ needs.pick.outputs.count }} --jobs 2 --timeout 600

      # .test-logs is a dot folder: upload-artifact skips those unless include-hidden-files is on (run 40201002060 uploaded nothing)
      - name: Upload logs of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-shard-${{ matrix.shard }}
          path: .test-logs/
          include-hidden-files: true
          retention-days: 7
