# TEMPORARY (branch test/windows-hunt only): real Windows user flows, mock backend, no keys. Removed before merge.
name: Windows hunt

on:
  workflow_dispatch:
  push:
    branches: [test/windows-hunt]

permissions:
  contents: read

concurrency:
  group: windows-hunt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hunt:
    name: Windows hunt (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, node: '24' }
          - { os: windows-2022, node: '22' }
    defaults:
      run:
        shell: powershell
    env:
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@example.invalid
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Name this commit main (the installer clones main from the checkout)
        run: git branch -f main HEAD

      - name: 1. Install with get.ps1 into a folder with a space and non-ASCII letters (-Yes, winget for missing tools)
        run: |
          . .github\windows-hunt\common.ps1
          Write-Host "PowerShell $($PSVersionTable.PSVersion); winget: $([bool](Get-Command winget -ErrorAction SilentlyContinue)); ffmpeg before: $([bool](Get-Command ffmpeg -ErrorAction SilentlyContinue))"
          $env:IIAYN_REPO = $RepoUrl
          $t0 = Get-Date
          & ([scriptblock]::Create((Get-Content -Raw scripts\get.ps1))) -Yes -NoStart -NoShortcut -Dir $Dir *>&1 | Tee-Object -FilePath "$Work\1-install.log"
          Write-Host "install took $([int]((Get-Date) - $t0).TotalSeconds) s"
          Update-PathFromRegistry
          $ff = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if (-not $ff -and -not (Get-Command winget -ErrorAction SilentlyContinue)) {
            # no winget on this image (get.ps1 skips ffmpeg there, as documented): test-only fallback so the media checks can run
            choco install ffmpeg -y --no-progress | Out-Null; Update-PathFromRegistry; $env:Path += ";$env:ProgramData\chocolatey\bin"; $ff = Get-Command ffmpeg -ErrorAction SilentlyContinue
          }
          if ($ff) { Split-Path -Parent $ff.Source | Out-File -Append -Encoding ascii $env:GITHUB_PATH }
          Check (Test-Path (Join-Path $Dir 'node_modules\fastify')) 'dependencies installed'
          Check (Test-Path (Join-Path $Dir 'mcp\node_modules')) 'MCP dependencies installed (postinstall)'
          Check ([bool]$ff) 'ffmpeg available after install'
          if ($script:Fails) { exit 1 }

      - name: 2. Start like a new user (irm | iex, no options) and wait for web + API
        run: |
          . .github\windows-hunt\common.ps1
          $env:USERPROFILE = $HuntHome   # so the installer's default folder is the install above
          $env:IIAYN_REPO = $RepoUrl
          $env:OPENHIGGSFIELD_BACKEND = 'mock'
          $url = 'file:///' + ((Resolve-Path scripts\get.ps1).Path -replace '\\', '/')
          Set-Content -Encoding ascii "$Work\start.ps1" "irm '$url' | iex *> '$Work\2-app.log'"
          # Start-Process: its own console window, and no inherited handles (the step would otherwise wait for the app to exit)
          $app = Start-Process powershell -ArgumentList '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-File', "`"$Work\start.ps1`"" -WindowStyle Minimized -PassThru
          Write-Host "app window process $($app.Id)"
          $ready = $false
          for ($i = 0; $i -lt 150 -and -not $ready; $i++) {
            Start-Sleep -Seconds 2
            if ($i % 15 -eq 0) { Write-Host "waiting ($($i * 2) s)..." }
            try { $a = Invoke-WebRequest -UseBasicParsing -TimeoutSec 3 http://127.0.0.1:8787/api/health; $w = Invoke-WebRequest -UseBasicParsing -TimeoutSec 3 http://127.0.0.1:5174/; $ready = ($a.StatusCode -eq 200 -and $w.StatusCode -eq 200) } catch { }
          }
          Get-Content "$Work\2-app.log" -ErrorAction SilentlyContinue | Select-Object -Last 60
          Check $ready 'web (5174) and API (8787) answer'
          for ($i = 0; $i -lt 20 -and -not (Select-String -Quiet -Path "$Work\2-app.log" -Pattern 'Ready: opened'); $i++) { Start-Sleep 2 }
          Check (Select-String -Quiet -Path "$Work\2-app.log" -Pattern 'Ready: opened') 'setup --open said it opened the browser'
          $browsers = Get-Process msedge, chrome, firefox -ErrorAction SilentlyContinue
          Write-Host "browser processes after --open: $(@($browsers).Count)"
          Get-Listeners | Format-Table LocalAddress, LocalPort, OwningProcess
          Check (-not (Get-Listeners | Where-Object { $_.LocalAddress -notin '127.0.0.1', '::1' })) 'listens on loopback only (no firewall prompt)'
          if ($script:Fails) { exit 1 }

      - name: 3. API flows (health, tools, models, mock image job, upload with spaces, export/import)
        if: success() || failure()
        run: |
          . .github\windows-hunt\common.ps1
          node .github\windows-hunt\smoke.mjs http://127.0.0.1:8787 http://127.0.0.1:5174 (Join-Path $Dir 'server\data') $Work 2>&1 | Tee-Object -FilePath "$Work\3-smoke.log"
          if ($LASTEXITCODE) { exit 1 }

      - name: 4. npm run doctor
        if: success() || failure()
        run: |
          . .github\windows-hunt\common.ps1
          Push-Location $Dir
          npm.cmd run doctor 2>&1 | Tee-Object -FilePath "$Work\4-doctor.log"; $code = $LASTEXITCODE
          Pop-Location
          Write-Host "doctor exit $code"
          Check ($code -in 0, 1) 'doctor ran (exit 0 or 1)'
          if ($script:Fails) { exit 1 }

      - name: 5. Stop with Ctrl+C in the app window, ports freed, nothing left running
        if: success() || failure()
        run: |
          . .github\windows-hunt\common.ps1
          $host1 = Get-CimInstance Win32_Process -Filter "Name = 'powershell.exe'" | Where-Object { $_.CommandLine -like '*start.ps1*' } | Select-Object -First 1
          Write-Host "app window process: $($host1.ProcessId)"
          Write-Host 'node processes before:'; Get-AppNodes | ForEach-Object { "  $($_.ProcessId) <- $($_.ParentProcessId)  $($_.CommandLine)" }
          $p = Start-Process powershell -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', "$env:GITHUB_WORKSPACE\.github\windows-hunt\ctrlc.ps1", '-Target', $host1.ProcessId -Wait -PassThru -WindowStyle Hidden
          Write-Host "ctrl+c helper exit $($p.ExitCode)"
          $free = $false; for ($i = 0; $i -lt 30 -and -not $free; $i++) { Start-Sleep 1; $free = -not (Get-Listeners) }
          Check $free 'ports 8787, 5174, 8788 freed after Ctrl+C'
          Start-Sleep 3
          $left = @(Get-AppNodes)
          Write-Host 'node processes after:'; $left | ForEach-Object { "  $($_.ProcessId) <- $($_.ParentProcessId)  $($_.CommandLine)" }
          Check ($left.Count -eq 0) 'no node/esbuild process left running'
          Get-Content "$Work\2-app.log" -ErrorAction SilentlyContinue | Select-Object -Last 25
          # clean up whatever is left so later steps start clean
          if ($host1) { taskkill /T /F /PID $host1.ProcessId 2>$null | Out-Null }
          $left | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          if ($script:Fails) { exit 1 }

      - name: 6. Update path (npm run update, then get.ps1 again with the shortcut)
        if: success() || failure()
        run: |
          . .github\windows-hunt\common.ps1
          # a new commit on main in the source the install follows
          $c = git commit-tree 'HEAD^{tree}' -p main -m 'hunt: a new change to update to'
          git update-ref refs/heads/main $c
          Push-Location $Dir
          npm.cmd run update 2>&1 | Tee-Object -FilePath "$Work\6-update.log"; $code = $LASTEXITCODE
          Pop-Location
          Check ($code -eq 0 -and (Select-String -Quiet -Path "$Work\6-update.log" -Pattern 'Updated')) 'npm run update pulled the new change'
          $env:IIAYN_REPO = $RepoUrl
          & ([scriptblock]::Create((Get-Content -Raw scripts\get.ps1))) -Yes -NoStart -Dir $Dir *>&1 | Tee-Object -FilePath "$Work\6-get-again.log"
          Check (Select-String -Quiet -Path "$Work\6-get-again.log" -Pattern 'Updating the app in') 'get.ps1 again finds the install and updates it'
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Imagination.lnk'
          Check (Test-Path $lnk) 'desktop shortcut created'
          if (Test-Path $lnk) {
            $s = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
            Write-Host "shortcut: $($s.TargetPath) $($s.Arguments) in [$($s.WorkingDirectory)] icon $($s.IconLocation)"
            Check ($s.WorkingDirectory -eq $Dir) 'shortcut working folder is the install folder (non-ASCII intact)'
            # run what the shortcut runs, without --open, for a short start/stop check
            $cmdline = $s.Arguments -replace '^/k ', '' -replace ' --open$', ''
            $env:OPENHIGGSFIELD_BACKEND = 'mock'
            Start-Process cmd -ArgumentList '/c', "$cmdline > `"$Work\6-shortcut-app.log`" 2>&1" -WorkingDirectory $Dir -WindowStyle Minimized
            $ok = $false; for ($i = 0; $i -lt 90 -and -not $ok; $i++) { Start-Sleep 2; try { $ok = (Invoke-WebRequest -UseBasicParsing -TimeoutSec 3 http://127.0.0.1:8787/api/health).StatusCode -eq 200 } catch { } }
            Check $ok 'the shortcut command starts the app'
            Get-Content "$Work\6-shortcut-app.log" -ErrorAction SilentlyContinue | Select-Object -Last 20
            Get-CimInstance Win32_Process -Filter "Name = 'cmd.exe'" | Where-Object { $_.CommandLine -like '*6-shortcut-app.log*' } | ForEach-Object { taskkill /T /F /PID $_.ProcessId 2>$null | Out-Null }
            Get-AppNodes | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          }
          if ($script:Fails) { exit 1 }

      - name: 7. Server tests that touch paths, files and processes
        if: success() || failure()
        run: |
          . .github\windows-hunt\common.ps1
          Push-Location $Dir
          node scripts\test-all.mjs --jobs 2 --timeout 400 --only '/^(relpaths|bh4|doctor|comfy-models-dir|update-script|setup-launch-env|upload-security|share-export|orphan-quarantine|form-files|machine-profiles|get-installer)\./' 2>&1 | Tee-Object -FilePath "$Work\7-tests.log"; $code = $LASTEXITCODE
          if (Test-Path .test-logs) { Copy-Item -Recurse -Force .test-logs "$Work\test-logs" }
          Pop-Location
          if ($code) { exit 1 }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-hunt-${{ matrix.os }}
          path: ${{ runner.temp }}/hunt
          if-no-files-found: warn
