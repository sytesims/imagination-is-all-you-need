<!doctype html>
<!-- Direct a Shot: a sample imported scene that follows the contract in docs/PLAN-A-SHOT.md.
     Plain Canvas 2D (no libraries, no network): three boxes on a floor, the camera circles them over 6 seconds.
     window.previz = { duration, seek(t), setPass(name), passes }. Everything is a function of t. AGPL-3.0-or-later, part of this repo. -->
<html><head><meta charset="utf-8"><title>Sample scene</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100%;height:100%}</style></head>
<body><canvas id="c"></canvas>
<script>
(() => {
  const cv = document.getElementById('c'); const x = cv.getContext('2d');
  const DURATION = 6; let pass = 'beauty'; let lastT = 0;
  // the set: [cx, cz, width, depth, height, colour]
  const BOXES = [[0, 0, 1.2, 1.2, 1.6, '#e8742a'], [-2.2, -1.2, 1, 1.4, 0.9, '#4a6fd6'], [2.0, -0.8, 0.9, 0.9, 2.4, '#2f9c96']];
  const ease = (k) => { k = Math.min(1, Math.max(0, k)); return k * k * k * (k * (k * 6 - 15) + 10); };
  function camera(t) { const a = -0.7 + 1.4 * ease(t / DURATION); return { p: [Math.sin(a) * 7, 2.6, Math.cos(a) * 7], l: [0, 0.8, 0] }; }
  function size() { const w = Math.max(2, Math.round(innerWidth)), h = Math.max(2, Math.round(innerHeight)); if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; } }
  function draw(t) {
    size(); const W = cv.width, H = cv.height; const c = camera(t);
    const f = sub(c.l, c.p); norm(f); const r = cross(f, [0, 1, 0]); norm(r); const u = cross(r, f);
    const focal = (H / 2) / Math.tan((40 * Math.PI) / 360) * (W < H ? 0.7 : 1);
    const proj = (q) => { const d = sub(q, c.p); const z = dot(d, f); return z <= 0.05 ? null : [W / 2 + (dot(d, r) / z) * focal, H / 2 - (dot(d, u) / z) * focal, z]; };
    // sky / background
    x.fillStyle = pass === 'depth' ? '#000' : pass === 'clay' ? '#7a7a7a' : '#cfd6de'; x.fillRect(0, 0, W, H);
    // floor as quads, far first
    const faces = [];
    for (let i = -6; i < 6; i++) for (let k = -6; k < 6; k++) faces.push({ pts: [[i, 0, k], [i + 1, 0, k], [i + 1, 0, k + 1], [i, 0, k + 1]], col: (i + k) & 1 ? '#a9a39a' : '#b3ada4', n: [0, 1, 0], floor: true });
    for (const [cx, cz, w, d, h, col] of BOXES) {
      const X0 = cx - w / 2, X1 = cx + w / 2, Z0 = cz - d / 2, Z1 = cz + d / 2;
      faces.push({ pts: [[X0, h, Z0], [X1, h, Z0], [X1, h, Z1], [X0, h, Z1]], col, n: [0, 1, 0] });
      faces.push({ pts: [[X0, 0, Z1], [X1, 0, Z1], [X1, h, Z1], [X0, h, Z1]], col, n: [0, 0, 1] });
      faces.push({ pts: [[X0, 0, Z0], [X1, 0, Z0], [X1, h, Z0], [X0, h, Z0]], col, n: [0, 0, -1] });
      faces.push({ pts: [[X1, 0, Z0], [X1, 0, Z1], [X1, h, Z1], [X1, h, Z0]], col, n: [1, 0, 0] });
      faces.push({ pts: [[X0, 0, Z0], [X0, 0, Z1], [X0, h, Z1], [X0, h, Z0]], col, n: [-1, 0, 0] });
    }
    const light = [0.5, 0.8, 0.35]; norm(light);
    const drawn = faces.map((fc) => { const pp = fc.pts.map(proj); if (pp.some((p) => !p)) return null; const zc = pp.reduce((a, p) => a + p[2], 0) / pp.length;
      const mid = fc.pts.reduce((a, p) => [a[0] + p[0] / 4, a[1] + p[1] / 4, a[2] + p[2] / 4], [0, 0, 0]); if (dot(fc.n, sub(c.p, mid)) <= 0) return null; return { fc, pp, zc }; }).filter(Boolean).sort((a, b) => (b.fc.floor ? 1 : 0) - (a.fc.floor ? 1 : 0) || b.zc - a.zc); // the floor first (it lies under everything), then far to near
    for (const { fc, pp, zc } of drawn) {
      const shade = 0.55 + 0.45 * Math.max(0, dot(fc.n, light));
      let fill;
      if (pass === 'depth') { const v = Math.round(255 * Math.min(1, Math.max(0, 1 - (zc - 3) / 12))); fill = `rgb(${v},${v},${v})`; }
      else if (pass === 'clay') { const v = Math.round(190 * shade); fill = `rgb(${v},${v},${v})`; }
      else { const n = parseInt(fc.col.slice(1), 16); fill = `rgb(${Math.round(((n >> 16) & 255) * shade)},${Math.round(((n >> 8) & 255) * shade)},${Math.round((n & 255) * shade)})`; }
      x.fillStyle = fill; x.strokeStyle = fill; x.lineWidth = 1; x.beginPath(); pp.forEach((p, i) => (i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1]))); x.closePath(); x.fill(); x.stroke();
    }
  }
  function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; } function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
  function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; } function norm(a) { const l = Math.hypot(a[0], a[1], a[2]) || 1; a[0] /= l; a[1] /= l; a[2] /= l; }
  window.previz = { duration: DURATION, passes: ['beauty', 'clay', 'depth'], seek(t) { lastT = Math.min(DURATION, Math.max(0, Number(t) || 0)); draw(lastT); }, setPass(name) { pass = name; draw(lastT); } };
  addEventListener('resize', () => draw(lastT));
  window.previz.seek(0);
})();
</script></body></html>
